services:

  # ==========================================================
  # AMU CRAWLER
  # Uses EXISTING PostgreSQL queue and EXISTING corpus.
  # ==========================================================

  amu-crawler-v2:
    build:
      context: .
      dockerfile: Dockerfile.crawler

    image: amu-crawler-v3:production

    container_name: amu-crawler-v2

    restart: unless-stopped

    environment:
      # ------------------------------------------------------
      # EXISTING POSTGRESQL
      # ------------------------------------------------------
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SCHEMA: ${DB_SCHEMA}
      DB_TABLE: ${DB_TABLE}

      # ------------------------------------------------------
      # FIRECRAWL
      # ------------------------------------------------------
      FIRECRAWL_URL: ${FIRECRAWL_URL}
      FIRECRAWL_TIMEOUT: "180"

      # ------------------------------------------------------
      # CONCURRENCY
      # ------------------------------------------------------
      HTML_WORKERS: "12"
      PDF_WORKERS: "16"

      # ------------------------------------------------------
      # RETRIES
      # ------------------------------------------------------
      MAX_RETRIES: "8"
      STALE_MINUTES: "30"
      POLL_SECONDS: "1"

      # ------------------------------------------------------
      # PDF
      # ------------------------------------------------------
      PDF_MIN_TEXT_CHARS: "80"

      # ------------------------------------------------------
      # DOMAINS
      # ------------------------------------------------------
      ALLOWED_DOMAINS: "amu.ac.in"

      # ------------------------------------------------------
      # old.amu.ac.in
      # Conservative exponential backoff
      # ------------------------------------------------------
      OLD_BACKOFF_BASE: "10"
      OLD_BACKOFF_MAX: "900"

      # ------------------------------------------------------
      # CORPUS
      # ------------------------------------------------------
      CORPUS: /amu-corpus

      LOG_LEVEL: INFO

    volumes:
      - amu-crawler_amu_corpus:/amu-corpus

    networks:
      - firecrawl-backend

    mem_limit: 8g

    stop_grace_period: 30s


  # ==========================================================
  # OCR WORKER
  #
  # Custom OCR image.
  # Dependencies are installed at BUILD TIME.
  # ==========================================================

  amu-crawler-v2-ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr

    image: amu-crawler-ocr:production

    container_name: amu-crawler-v2-ocr

    restart: unless-stopped

    environment:
      # ------------------------------------------------------
      # EXISTING POSTGRESQL
      # ------------------------------------------------------
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SCHEMA: ${DB_SCHEMA}
      DB_TABLE: ${DB_TABLE}

      # ------------------------------------------------------
      # EXISTING CORPUS
      # ------------------------------------------------------
      CORPUS: /amu-corpus

      # ------------------------------------------------------
      # OCR
      # ------------------------------------------------------
      OCR_WORKERS: "1"

      OCR_LANG: "eng+hin+urd"

      # Render PDF pages at 200 DPI before Tesseract OCR
      OCR_DPI: "200"

      # Tesseract page segmentation mode
      OCR_PSM: "6"

      # Maximum time allowed for OCR of one page
      OCR_PAGE_TIMEOUT: "300"

      OCR_POLL_SECONDS: "2"
      OCR_WATCHDOG_ENABLED: "1"
      OCR_WATCHDOG_INTERVAL: "60"
      OCR_WATCHDOG_STALE_MINUTES: "15"

      LOG_LEVEL: INFO

    volumes:
      - amu-crawler_amu_corpus:/amu-corpus

    networks:
      - firecrawl-backend

    mem_limit: 6g

    stop_grace_period: 30s


# ============================================================
# EXISTING FIRECRAWL NETWORK
# ============================================================

networks:

  firecrawl-backend:
    external: true
    name: anything_firecrawl-backend


# ============================================================
# EXISTING AMU CORPUS VOLUME
#
# DO NOT REMOVE.
# DO NOT RENAME.
# This contains the ~2 GB corpus already scraped.
# ============================================================

volumes:

  amu-crawler_amu_corpus:
    external: true
    name: amu-crawler_amu_corpus